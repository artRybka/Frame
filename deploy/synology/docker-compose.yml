# Frame server on Synology (Container Manager → Project → Create → this file),
# next to Home Assistant Container. Same image as the HA add-on.
services:
  frame:
    image: ghcr.io/artrybka/frame:latest
    # Pull the image on every start, so Container Manager's "Build" picks up
    # a newly published `latest` without deleting the old image first.
    pull_policy: always
    container_name: frame
    restart: unless-stopped
    # Host network: the panel downloads from <NAS IP>:8099 and Wake-on-LAN
    # needs to broadcast on the LAN.
    network_mode: host
    volumes:
      - ./data:/data
    env_file:
      - frame.env

  # Updates `frame` when the app asks (Konfiguracja → Serwer ramki), so
  # "Build" is needed only after editing this file or frame.env. It talks to
  # Docker through the socket and has no network at all (the Docker daemon
  # pulls the image); the server only leaves it a request in data/update.
  updater:
    image: ghcr.io/artrybka/frame:latest
    pull_policy: always
    container_name: frame-updater
    restart: unless-stopped
    command: ["frame", "updater", "--container", "frame"]
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/update:/data/update
