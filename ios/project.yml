# Xcode project definition — generate with:  cd ios && xcodegen generate
name: Frame
options:
  bundleIdPrefix: com.artrybka
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Local builds only: TestFlight uploads use the release version from
    # ha-addon/config.yaml (.github/workflows/testflight.yml).
    MARKETING_VERSION: "1.0"
    # CI uploads override this with a timestamp (.github/workflows/testflight.yml).
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer team (not a secret: it is embedded in every signed build).
    DEVELOPMENT_TEAM: 3MQRJF4A9D
    CODE_SIGN_STYLE: Automatic
targets:
  Frame:
    type: application
    platform: iOS
    sources:
      - Frame
      - Shared
    dependencies:
      - target: FrameWidgets
    info:
      path: Frame/Info.plist
      properties:
        CFBundleDisplayName: Frame
        # XcodeGen otherwise hardcodes 1.0 / 1 and ignores the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pl
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Frame łączy się z serwerem ramki w Twojej sieci domowej.
        # "Zapisz w Zdjęciach" on a work's screen: add-only, Frame never reads the library.
        NSPhotoLibraryAddUsageDescription: Frame zapisuje wybrane dzieła w Twoich Zdjęciach.
        NSBonjourServices:
          - _frame._tcp
        NSAppTransportSecurity:
          # The frame server speaks plain HTTP, and home LANs can use non-private
          # ranges (non-RFC 1918 addresses) that NSAllowsLocalNetworking does not cover.
          # Do not add NSAllowsLocalNetworking back: it makes iOS ignore this key.
          NSAllowsArbitraryLoads: true
        # Only system TLS (URLSession): exempt, so TestFlight skips the export question.
        ITSAppUsesNonExemptEncryption: false
        # The send bar on the Lock Screen and in the Dynamic Island (FrameWidgets).
        NSSupportsLiveActivities: true
        # The composition's hand-written labels (Resources/Fonts, SIL OFL).
        UIAppFonts:
          - Caveat-SemiBold.ttf
    # Notifications from the server over APNs. Xcode builds use the sandbox;
    # the App Store export turns this into "production" (TestFlight).
    entitlements:
      path: Frame/Frame.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artrybka.frame
        # iPhone only: the UI is portrait-only, which iPad builds may not be.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FrameWidgets:
    # Live Activity only (no home screen widgets yet): the picture on its way to the frame.
    type: app-extension
    platform: iOS
    sources:
      - FrameWidgets
      - Shared
    info:
      path: FrameWidgets/Info.plist
      properties:
        CFBundleDisplayName: Frame
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pl
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artrybka.frame.widgets
        TARGETED_DEVICE_FAMILY: "1"
  FrameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FrameTests
    dependencies:
      - target: Frame
schemes:
  Frame:
    build:
      targets:
        Frame: all
        FrameTests: [test]
    test:
      targets:
        - FrameTests
