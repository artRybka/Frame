# Xcode project definition — generate with:  cd ios && xcodegen generate
name: Frame
options:
  bundleIdPrefix: com.artrybka
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    # CI uploads override this with a timestamp (.github/workflows/testflight.yml).
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer team (not a secret: it is embedded in every signed build).
    DEVELOPMENT_TEAM: 3MQRJF4A9D
    CODE_SIGN_STYLE: Automatic
targets:
  Frame:
    type: application
    platform: iOS
    sources:
      - Frame
    info:
      path: Frame/Info.plist
      properties:
        CFBundleDisplayName: Frame
        # XcodeGen otherwise hardcodes 1.0 / 1 and ignores the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pl
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Frame łączy się z serwerem ramki w Twojej sieci domowej.
        NSBonjourServices:
          - _frame._tcp
        NSAppTransportSecurity:
          # The frame server lives on the LAN and speaks plain HTTP.
          NSAllowsLocalNetworking: true
        # Only system TLS (URLSession): exempt, so TestFlight skips the export question.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artrybka.frame
        # iPhone only: the UI is portrait-only, which iPad builds may not be.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FrameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FrameTests
    dependencies:
      - target: Frame
schemes:
  Frame:
    build:
      targets:
        Frame: all
        FrameTests: [test]
    test:
      targets:
        - FrameTests
