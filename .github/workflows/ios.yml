name: ios

# Branch pushes only: a PR from a branch here shows these same checks, and on
# main the TestFlight archive compiles the merge anyway. Screenshots live in
# ios-screenshots.yml and run on demand.
on:
  push:
    branches-ignore: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: >
          xcodebuild test
          -project Frame.xcodeproj
          -scheme Frame
          -destination "id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO

