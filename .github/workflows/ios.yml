name: ios

# Branch pushes only: a PR from a branch here shows these same checks, and on
# main the TestFlight archive compiles the merge anyway. Screenshots live in
# ios-screenshots.yml and run on demand.
on:
  push:
    branches-ignore: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # libtailscale for the Tailscale built into the app (D16): Go, built once
      # per revision of the script and kept in the cache.
      - name: Cache libtailscale
        id: tailscale
        uses: actions/cache@v4
        with:
          path: ios/Vendor/Tailscale
          key: libtailscale-${{ hashFiles('ios/scripts/build-tailscale.sh') }}
      - uses: actions/setup-go@v5
        if: steps.tailscale.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build libtailscale
        if: steps.tailscale.outputs.cache-hit != 'true'
        run: scripts/build-tailscale.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      # The app needs iOS 26: the newest runtime's iPhone.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,re,sys; d=json.load(sys.stdin)['devices']; v=lambda r: [int(n) for n in re.findall(r'\d+', r.split('iOS')[-1])]; print(next(x['udid'] for r in sorted((r for r in d if 'iOS' in r), key=v, reverse=True) for x in d[r] if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: >
          xcodebuild test
          -project Frame.xcodeproj
          -scheme Frame
          -destination "id=${{ steps.sim.outputs.udid }}"
          CODE_SIGNING_ALLOWED=NO

