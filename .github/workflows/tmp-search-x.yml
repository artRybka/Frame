name: tmp-search-x

# TEMPORARY (thread "Dodaj X czyszczący wyszukiwanie i grupy"): a video of
# the search opening for a group's X. Removed before release.
on:
  push:
    branches: [claude/project-thread-o7bk9f]
    paths: ["ios/**", ".github/workflows/tmp-search-x.yml"]

jobs:
  screenshots:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Boot a Pro-size iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          # The app needs iOS 26: the newest runtime's iPhones.
          runtimes = sorted((r for r in devices if 'iOS' in r), key=lambda r: [int(n) for n in re.findall(r'\d+', r.split('iOS')[-1])])
          phones = [d for d in devices[runtimes[-1]] if d['name'].startswith('iPhone')]
          pro = [d for d in phones if 'Pro' in d['name'] and 'Max' not in d['name']]
          print((pro or phones)[-1]['udid'])
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Build app
        run: >
          xcodebuild build
          -project Frame.xcodeproj
          -scheme Frame
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - name: Record
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -x
          mkdir -p shots
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Frame.app
          xcrun simctl ui "$UDID" appearance light
          for route in search-chosen editor; do
            xcrun simctl terminate "$UDID" com.artrybka.frame || true
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "shots/$route.mp4" &
            rec=$!
            sleep 2
            xcrun simctl launch --stdout="$PWD/shots/$route.log" --stderr="$PWD/shots/$route.err" "$UDID" com.artrybka.frame -demo YES -screen "$route"
            sleep 12
            kill -INT $rec; wait $rec || true
          done
          xcrun simctl terminate "$UDID" com.artrybka.frame || true
          xcrun simctl launch "$UDID" com.artrybka.frame -demo YES -screen search-colors
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/search-colors.png
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: ios/shots/*
          retention-days: 3
