name: vision-diag

# A diagnosis for one question (what Vision finds in works much wider than
# the screen): taken out again before the branch is released.
on:
  push:
    branches: [claude/project-thread-dhtd0h]
    paths: ["scratch/vision-diag/**", ".github/workflows/vision-diag.yml"]

jobs:
  look:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Works to look at besides the two
        run: |
          mkdir -p "$RUNNER_TEMP/works"
          n=0
          while read -r url; do
            n=$((n + 1))
            curl -sS -m 60 -A "frame-diag/1.0 (art frame test script)" -o "$(printf '%s/works/w%02d.jpg' "$RUNNER_TEMP" "$n")" "$url" || true
            sleep 1
          done < scratch/vision-diag/works.txt
          ls -la "$RUNNER_TEMP/works"
      - run: swift scratch/vision-diag/diag.swift scratch/vision-diag/*.jpg "$RUNNER_TEMP"/works/*.jpg
