name: ios-screenshots

# Demo-mode screenshots of every screen, on demand only (~20 min on macOS, so
# not on every push). Run it on a branch that changes the look:
#   Actions -> ios-screenshots -> Run workflow, or the API's workflow_dispatch
# with ref=<branch>. The PNGs come back as the "screenshots" artifact.
on:
  workflow_dispatch:
    inputs:
      appearance:
        description: Which appearance to capture
        type: choice
        options: [both, light, dark]
        default: both
      only:
        description: Capture only shots whose name matches this regex (empty = all)
        type: string
        default: ""

jobs:
  screenshots:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # libtailscale for the Tailscale built into the app (D16): Go, built once
      # per revision of the script and kept in the cache.
      - name: Cache libtailscale
        id: tailscale
        uses: actions/cache@v4
        with:
          path: ios/Vendor/Tailscale
          key: libtailscale-${{ hashFiles('ios/scripts/build-tailscale.sh') }}
      - uses: actions/setup-go@v5
        if: steps.tailscale.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build libtailscale
        if: steps.tailscale.outputs.cache-hit != 'true'
        run: scripts/build-tailscale.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Boot a Pro-size iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          # The app needs iOS 26: the newest runtime's iPhones.
          runtimes = sorted((r for r in devices if 'iOS' in r), key=lambda r: [int(n) for n in re.findall(r'\d+', r.split('iOS')[-1])])
          phones = [d for d in devices[runtimes[-1]] if d['name'].startswith('iPhone')]
          pro = [d for d in phones if 'Pro' in d['name'] and 'Max' not in d['name']]
          print((pro or phones)[-1]['udid'])
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Build app
        run: >
          xcodebuild build
          -project Frame.xcodeproj
          -scheme Frame
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - name: Capture screens (demo mode)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APPEARANCES: ${{ inputs.appearance == 'both' && 'light dark' || inputs.appearance }}
          ONLY: ${{ inputs.only }}
        run: |
          set -x
          mkdir -p shots
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Frame.app
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          capture() {
            if [ -n "$ONLY" ] && ! [[ "$3" =~ $ONLY ]]; then return 0; fi
            xcrun simctl terminate "$UDID" com.artrybka.frame || true
            xcrun simctl launch "$UDID" com.artrybka.frame -demo YES -screen "$1" "${@:4}"
            sleep "${2:-12}"
            xcrun simctl io "$UDID" screenshot "shots/$3.png"
          }
          for appearance in $APPEARANCES; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            capture now 16 "now-$appearance"
            capture now 16 "now-colour-oil-$appearance" -paintStyle oil
            capture now 16 "now-colour-water-$appearance" -paintStyle water
            capture now 16 "now-colour-burin-$appearance" -paintStyle burin -paintColours c7bc9a:0.431/7e6e52:0.179/9d7f5a:0.171/ac9c77:0.138/c06e4f:0.044/aa8e38:0.043
            capture discover 12 "discover-$appearance"
            capture discover 14 "discover-studies-$appearance" -scroll studies
            capture discover 14 "discover-zoom-$appearance" -scroll zoom
            capture discover-group 12 "discover-group-$appearance"
            capture daily 14 "daily-$appearance"
            capture daily 16 "daily-end-$appearance" -scroll end
            capture daily 16 "daily-composition-$appearance" -scroll composition
            capture daily 16 "daily-composition-picture-$appearance" -scroll composition -compositionBare YES
            capture daily 16 "daily-composition-bedroom-$appearance" -scroll composition -demoStudy bedroom
            capture daily 16 "daily-composition-shower-$appearance" -scroll composition -demoStudy shower
            capture daily 16 "daily-composition-moulin-$appearance" -scroll composition -demoStudy moulin
            capture daily 16 "daily-composition-lit-$appearance" -scroll composition -chalkDemo lit
            capture daily 16 "daily-composition-plain-$appearance" -scroll composition -chalkDemo none
            capture daily 16 "daily-composition-shower-lit-$appearance" -scroll composition -demoStudy shower -chalkDemo lit
            capture daily 16 "daily-composition-shower-plain-$appearance" -scroll composition -demoStudy shower -chalkDemo none
            capture daily 16 "daily-composition-drawing-a-$appearance" -scroll composition -sheetDrawn 0.3
            capture daily 16 "daily-composition-drawing-b-$appearance" -scroll composition -sheetDrawn 0.62
            capture daily 16 "daily-composition-drawing-shower-$appearance" -scroll composition -demoStudy shower -sheetDrawn 0.45
            capture daily 16 "daily-composition-chosen-$appearance" -scroll composition -chalkChosen 2
            capture daily 16 "daily-composition-bedroom-chosen-$appearance" -scroll composition -demoStudy bedroom -chalkChosen 3
            # The sheet drawn by an image model (a stand-in in the demo):
            # coloured lines, the sketch alone after a tap, a note tapped.
            capture daily 16 "daily-drawn-$appearance" -scroll composition -demoDrawn YES
            capture daily 16 "daily-drawn-bare-$appearance" -scroll composition -demoDrawn YES -compositionBare YES
            capture daily 16 "daily-drawn-chosen-$appearance" -scroll composition -demoDrawn YES -chalkChosen 2
            capture daily 16 "daily-drawn-bedroom-$appearance" -scroll composition -demoDrawn YES -demoStudy bedroom
            capture daily 16 "daily-drawn-shower-$appearance" -scroll composition -demoDrawn YES -demoStudy shower
            capture daily 16 "daily-detail-geometry-$appearance" -scroll composition -take 1
            capture daily 16 "daily-details-$appearance" -scroll details
            capture daily 16 "daily-legacy-$appearance" -scroll legacy
            capture daily 16 "daily-author-$appearance" -scroll author
            capture daily 16 "daily-colour-$appearance" -scroll colour
            capture daily 16 "daily-colour-oil-$appearance" -scroll colour -paintStyle oil
            capture daily 16 "daily-colour-oil-mid-$appearance" -scroll colour -paintStyle oil -paintAge 2.4
            capture daily 16 "daily-colour-water-$appearance" -scroll colour -paintStyle water
            capture daily 16 "daily-colour-dry-$appearance" -scroll colour -paintStyle dry
            capture daily 16 "daily-colour-dry-mid-$appearance" -scroll colour -paintStyle dry -paintAge 2.4
            # Small colours as accents: a drop in a round of clean paper, a patch pressed hard.
            capture daily 16 "daily-colour-water-accents-$appearance" -scroll colour -paintStyle water -paintColours 526c8e:0.221/3b4e79:0.198/6f8593:0.169/303b4b:0.168/a0b07c:0.021/b5a43c:0.011/293690:0.020
            capture daily 16 "daily-colour-water-accents-mid-$appearance" -scroll colour -paintStyle water -paintAge 2.5 -paintColours 526c8e:0.221/3b4e79:0.198/6f8593:0.169/303b4b:0.168/a0b07c:0.021/b5a43c:0.011/293690:0.020
            capture daily 16 "daily-colour-dry-accents-$appearance" -scroll colour -paintStyle dry -paintColours 526c8e:0.221/3b4e79:0.198/6f8593:0.169/303b4b:0.168/a0b07c:0.021/b5a43c:0.011/293690:0.020
            capture daily 16 "daily-colour-burin-$appearance" -scroll colour -paintStyle burin -paintColours 918d78:0.28/4c4a3c:0.26/5f5c4b:0.24/78745f:0.22
            capture daily 16 "daily-colour-burin-mid-$appearance" -scroll colour -paintStyle burin -paintAge 1.2 -paintColours 918d78:0.28/4c4a3c:0.26/5f5c4b:0.24/78745f:0.22
            capture daily 16 "daily-colour-burin-patches-$appearance" -scroll colour -paintStyle burin -paintColours c7bc9a:0.431/7e6e52:0.179/9d7f5a:0.171/ac9c77:0.138/c06e4f:0.044/aa8e38:0.043
            capture daily 16 "daily-colour-burin-patches-mid-$appearance" -scroll colour -paintStyle burin -paintAge 1.0 -paintColours c7bc9a:0.431/7e6e52:0.179/9d7f5a:0.171/ac9c77:0.138/c06e4f:0.044/aa8e38:0.043
            capture daily 16 "daily-colour-pen-$appearance" -scroll colour -paintStyle pen -paintColours c9b79a:0.40/a9856a:0.27/8a5a44:0.20/6b3f30:0.13
            capture daily 16 "daily-colour-pencil-$appearance" -scroll colour -paintStyle pencil -paintColours d2cec4:0.46/a9a59c:0.26/7d7a74:0.18/55534f:0.10
            capture daily 16 "daily-colour-woodblock-$appearance" -scroll colour -paintStyle woodblock -paintColours d9cdb0:0.34/c8bc9d:0.22/1f3a5f:0.16/3d5f86:0.12/8fa7b8:0.09/e9e2cf:0.07
            capture daily 16 "daily-colour-woodblock-mid-$appearance" -scroll colour -paintStyle woodblock -paintAge 1.2 -paintColours d9cdb0:0.34/c8bc9d:0.22/1f3a5f:0.16/3d5f86:0.12/8fa7b8:0.09/e9e2cf:0.07
            capture daily 16 "daily-colour-litho-$appearance" -scroll colour -paintStyle litho -paintColours 1d1a17:0.30/e8dcc0:0.28/c8a23a:0.18/b5432b:0.14/6f7f4f:0.10
            capture daily 16 "daily-sametime-$appearance" -scroll sametime
            capture daily 16 "daily-size-$appearance" -scroll size
            capture daily 16 "daily-size-big-$appearance" -scroll size -realSize 210x163
            capture daily 16 "daily-size-huge-$appearance" -scroll size -realSize 378.5x647.7
            capture daily 16 "daily-journey-$appearance" -scroll journey
            capture daily 16 "daily-journey-detour-$appearance" -scroll journey-end -journeyDetour YES
            capture daily 16 "daily-journey-wash-$appearance" -scroll journey -journeyWash 0.45
            capture daily 16 "daily-journey-press-$appearance" -scroll journey -journeyWash 0.45 -journeyPress 0.6
            capture daily 16 "daily-journey-full-$appearance" -scroll journey -journeyWash 1
            capture daily 16 "daily-journey-full-end-$appearance" -scroll journey-end -journeyWash 1 -journeyDetour YES
            capture detail 14 "detail-$appearance"
            capture detail 16 "detail-about-$appearance" -scroll about
            # "Kolorystyka" on the card: the bar in the work's technique, there at once.
            capture detail 16 "detail-palette-$appearance" -scroll palette
            capture detail 16 "detail-palette-oil-$appearance" -scroll palette -paintStyle oil
            capture detail 16 "detail-palette-oil-smooth-$appearance" -scroll palette -paintStyle oil -paintRelief 0.3
            capture detail 16 "detail-palette-oil-thick-$appearance" -scroll palette -paintStyle oil -paintRelief 1
            capture detail 16 "detail-palette-pencil-patch-$appearance" -scroll palette -paintStyle pencil -paintColours f3ebe3:0.484/d0cec4:0.325/aeb1a5:0.122/909489:0.069/b0bd99:0.105:a/9cabac:0.071:a
            capture detail 16 "detail-palette-water-$appearance" -scroll palette -paintStyle water -paintColours 526c8e:0.221/3b4e79:0.198/6f8593:0.169/303b4b:0.168/a0b07c:0.021/b5a43c:0.011/293690:0.020
            capture detail 16 "detail-palette-dry-$appearance" -scroll palette -paintStyle dry -paintColours 526c8e:0.221/3b4e79:0.198/6f8593:0.169/303b4b:0.168/a0b07c:0.021/b5a43c:0.011/293690:0.020
            capture detail 16 "detail-palette-burin-$appearance" -scroll palette -paintStyle burin -paintColours 918d78:0.28/4c4a3c:0.26/5f5c4b:0.24/78745f:0.22
            capture detail 16 "detail-palette-woodblock-$appearance" -scroll palette -paintStyle woodblock -paintColours d9cdb0:0.34/c8bc9d:0.22/1f3a5f:0.16/3d5f86:0.12/8fa7b8:0.09/e9e2cf:0.07
            capture detail 16 "detail-palette-photo-$appearance" -scroll palette -paintStyle photo -paintColours c9c2b4:0.30/2a2826:0.25/8a847a:0.30/565049:0.15
            capture playlists 12 "playlists-$appearance"
            capture suggestions 14 "suggestions-$appearance"
            capture playlist 12 "playlist-$appearance"
            capture playlist 12 "lowres-playlist-$appearance" -demoLowSide all
            capture detail 16 "lowres-detail-$appearance" -demoLowSide all
            capture editor 12 "editor-$appearance"
            capture editor-new 12 "editor-new-$appearance"
            capture editor-manual 12 "editor-manual-$appearance"
            capture frame 10 "frame-$appearance"
            capture schedule 10 "schedule-$appearance"
            capture schedule-economy 10 "schedule-economy-$appearance"
            capture presentation 12 "presentation-$appearance"
            capture presentation-photo 12 "presentation-photo-$appearance"
            capture orientation 10 "orientation-$appearance"
            capture connection 10 "connection-$appearance"
            capture connection 10 "connection-display-$appearance" -settingsPage display
            capture connection 10 "connection-notifications-$appearance" -settingsPage notifications
            capture connection 10 "connection-sources-$appearance" -settingsPage sources
            capture connection 10 "connection-ai-$appearance" -settingsPage ai
            capture connection 10 "connection-library-$appearance" -settingsPage library
            capture connection 10 "connection-night-$appearance" -settingsPage night
            capture connection 12 "night-changes-$appearance" -settingsPage night -nightChanges YES
            capture connection 10 "connection-frame-$appearance" -settingsPage frame
            capture connection 10 "connection-server-$appearance" -settingsPage server
            capture connection 10 "connection-keys-$appearance" -settingsPage keys
            capture connection 10 "connection-diagnostics-$appearance" -settingsPage diagnostics
            capture battery 10 "battery-$appearance"
            # Confirmation dialogs: on iOS 26 a popover on what was tapped.
            capture frame 12 "confirm-update-$appearance" -confirm update
            capture connection 12 "confirm-describe-$appearance" -settingsPage ai -confirm describe
            capture playlists 12 "confirm-delete-playlist-$appearance" -confirm delete-playlist
            capture museums 8 "museums-$appearance"
            capture search 8 "search-$appearance"
            capture search-picker 8 "search-picker-$appearance"
            capture search-colors 8 "search-colors-$appearance"
            capture search-tones 8 "search-tones-$appearance"
            capture search-empty 8 "search-empty-$appearance"
            capture search-styles 8 "search-styles-$appearance"
            capture search-subjects 8 "search-subjects-$appearance"
            capture search-techniques 8 "search-techniques-$appearance"
            capture search-chosen 8 "search-chosen-$appearance"
            capture search-museums 8 "search-museums-$appearance"
            capture search-museums 10 "search-museums-typed-$appearance" -typed krak
            capture search-styles 8 "search-styles-typed-$appearance" -typed impr
            capture search-picker 8 "search-picker-typed-$appearance" -typed 1890
            capture send 8 "send-$appearance"
            capture browse 14 "browse-$appearance"
            capture history 16 "history-$appearance"
            capture history-back 16 "history-back-$appearance"
            capture now 16 "now-description-$appearance" -fit description -mat black
            capture now 16 "now-details-$appearance" -fit details -mat cream
            capture now 16 "now-picture-$appearance" -fit fit -mat picture
            capture browse 14 "browse-fit-$appearance" -fit fit
            capture crop 18 "crop-$appearance" -fit description -mat black
            capture original 16 "original-$appearance"
            capture notices 9 "notices-$appearance"
            # A picture on its way (demo: 4 s, then 2.5 s preparing, 2.5 s
            # sending, 9 s drawing): the bar while sending, then the frame
            # painted over in watercolour, the drawing held early, midway and
            # late (-drawn).
            capture swap 9 "swap-sending-$appearance"
            capture swap 16 "swap-drawing-early-$appearance" -drawn 0.3
            capture swap 16 "swap-drawing-$appearance" -drawn 0.55
            capture swap 16 "swap-drawing-late-$appearance" -drawn 0.8
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/shots/*.png
          retention-days: 14
