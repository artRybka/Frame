name: ios-screenshots

# Demo-mode screenshots of every screen, on demand only (~20 min on macOS, so
# not on every push). Run it on a branch that changes the look:
#   Actions -> ios-screenshots -> Run workflow, or the API's workflow_dispatch
# with ref=<branch>. The PNGs come back as the "screenshots" artifact.
on:
  workflow_dispatch:
    inputs:
      appearance:
        description: Which appearance to capture
        type: choice
        options: [both, light, dark]
        default: both
      only:
        description: Capture only shots whose name matches this regex (empty = all)
        type: string
        default: ""

jobs:
  screenshots:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # libtailscale for the Tailscale built into the app (D16): Go, built once
      # per revision of the script and kept in the cache.
      - name: Cache libtailscale
        id: tailscale
        uses: actions/cache@v4
        with:
          path: ios/Vendor/Tailscale
          key: libtailscale-${{ hashFiles('ios/scripts/build-tailscale.sh') }}
      - uses: actions/setup-go@v5
        if: steps.tailscale.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build libtailscale
        if: steps.tailscale.outputs.cache-hit != 'true'
        run: scripts/build-tailscale.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Boot a Pro-size iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          # The app needs iOS 26: the newest runtime's iPhones.
          runtimes = sorted((r for r in devices if 'iOS' in r), key=lambda r: [int(n) for n in re.findall(r'\d+', r.split('iOS')[-1])])
          phones = [d for d in devices[runtimes[-1]] if d['name'].startswith('iPhone')]
          pro = [d for d in phones if 'Pro' in d['name'] and 'Max' not in d['name']]
          print((pro or phones)[-1]['udid'])
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Build app
        run: >
          xcodebuild build
          -project Frame.xcodeproj
          -scheme Frame
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - name: Capture screens (demo mode)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APPEARANCES: ${{ inputs.appearance == 'both' && 'light dark' || inputs.appearance }}
          ONLY: ${{ inputs.only }}
        run: |
          set -x
          mkdir -p shots
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Frame.app
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          capture() {
            if [ -n "$ONLY" ] && ! [[ "$3" =~ $ONLY ]]; then return 0; fi
            xcrun simctl terminate "$UDID" com.artrybka.frame || true
            xcrun simctl launch "$UDID" com.artrybka.frame -demo YES -screen "$1" "${@:4}"
            sleep "${2:-12}"
            xcrun simctl io "$UDID" screenshot "shots/$3.png"
          }
          for appearance in $APPEARANCES; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            capture now 16 "now-$appearance"
            capture discover 12 "discover-$appearance"
            capture discover 14 "discover-studies-$appearance" -scroll studies
            capture discover 14 "discover-zoom-$appearance" -scroll zoom
            capture discover-group 12 "discover-group-$appearance"
            capture daily 14 "daily-$appearance"
            capture daily 16 "daily-end-$appearance" -scroll end
            capture daily 16 "daily-composition-$appearance" -scroll composition
            capture daily 16 "daily-detail-geometry-$appearance" -scroll composition -take 1
            capture daily 16 "daily-details-$appearance" -scroll details
            capture daily 16 "daily-legacy-$appearance" -scroll legacy
            capture daily 16 "daily-author-$appearance" -scroll author
            capture daily 16 "daily-colour-$appearance" -scroll colour
            capture daily 16 "daily-sametime-$appearance" -scroll sametime
            capture daily 16 "daily-size-$appearance" -scroll size
            capture daily 16 "daily-size-big-$appearance" -scroll size -realSize 210x163
            capture daily 16 "daily-size-huge-$appearance" -scroll size -realSize 378.5x647.7
            capture daily 16 "daily-journey-$appearance" -scroll journey
            capture detail 14 "detail-$appearance"
            capture detail 16 "detail-about-$appearance" -scroll about
            capture playlists 12 "playlists-$appearance"
            capture suggestions 14 "suggestions-$appearance"
            capture playlist 12 "playlist-$appearance"
            capture editor 12 "editor-$appearance"
            capture editor-new 12 "editor-new-$appearance"
            capture editor-manual 12 "editor-manual-$appearance"
            capture frame 10 "frame-$appearance"
            capture schedule 10 "schedule-$appearance"
            capture schedule-economy 10 "schedule-economy-$appearance"
            capture presentation 12 "presentation-$appearance"
            capture presentation-photo 12 "presentation-photo-$appearance"
            capture orientation 10 "orientation-$appearance"
            capture connection 10 "connection-$appearance"
            capture connection 10 "connection-display-$appearance" -settingsPage display
            capture connection 10 "connection-notifications-$appearance" -settingsPage notifications
            capture connection 10 "connection-sources-$appearance" -settingsPage sources
            capture connection 10 "connection-ai-$appearance" -settingsPage ai
            capture connection 10 "connection-library-$appearance" -settingsPage library
            capture connection 10 "connection-frame-$appearance" -settingsPage frame
            capture connection 10 "connection-server-$appearance" -settingsPage server
            capture connection 10 "connection-keys-$appearance" -settingsPage keys
            capture connection 10 "connection-diagnostics-$appearance" -settingsPage diagnostics
            capture battery 10 "battery-$appearance"
            # Confirmation dialogs: on iOS 26 a popover on what was tapped.
            capture frame 12 "confirm-update-$appearance" -confirm update
            capture connection 12 "confirm-describe-$appearance" -settingsPage ai -confirm describe
            capture playlists 12 "confirm-delete-playlist-$appearance" -confirm delete-playlist
            capture museums 8 "museums-$appearance"
            capture search 8 "search-$appearance"
            capture search-picker 8 "search-picker-$appearance"
            capture search-colors 8 "search-colors-$appearance"
            capture search-tones 8 "search-tones-$appearance"
            capture search-empty 8 "search-empty-$appearance"
            capture search-styles 8 "search-styles-$appearance"
            capture search-subjects 8 "search-subjects-$appearance"
            capture search-techniques 8 "search-techniques-$appearance"
            capture search-chosen 8 "search-chosen-$appearance"
            capture search-museums 8 "search-museums-$appearance"
            capture search-museums 10 "search-museums-typed-$appearance" -typed krak
            capture search-styles 8 "search-styles-typed-$appearance" -typed impr
            capture search-picker 8 "search-picker-typed-$appearance" -typed 1890
            capture send 8 "send-$appearance"
            capture browse 14 "browse-$appearance"
            capture history 16 "history-$appearance"
            capture history-back 16 "history-back-$appearance"
            capture now 16 "now-description-$appearance" -fit description -mat black
            capture now 16 "now-details-$appearance" -fit details -mat cream
            capture now 16 "now-picture-$appearance" -fit fit -mat picture
            capture browse 14 "browse-fit-$appearance" -fit fit
            capture crop 18 "crop-$appearance" -fit description -mat black
            capture original 16 "original-$appearance"
            capture notices 9 "notices-$appearance"
            # A picture on its way (demo: 4 s, then 2.5 s preparing, 2.5 s
            # sending, 9 s drawing): the bar while sending, then the frame
            # painted over in watercolour, the drawing held early, midway and
            # late (-drawn).
            capture swap 9 "swap-sending-$appearance"
            capture swap 16 "swap-drawing-early-$appearance" -drawn 0.3
            capture swap 16 "swap-drawing-$appearance" -drawn 0.55
            capture swap 16 "swap-drawing-late-$appearance" -drawn 0.8
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/shots/*.png
          retention-days: 14
