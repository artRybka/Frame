name: publish

# Multi-arch server image for running outside Home Assistant OS (e.g. Synology).
on:
  push:
    branches: [main]
    paths: ["server/**", "ha-addon/Dockerfile", "scripts/bundle-addon.sh", ".github/workflows/publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bundle server code into the build context
        run: scripts/bundle-addon.sh dist/frame
      - name: Image version
        id: meta
        run: echo "version=$(grep -m1 '^version' server/pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: dist/frame
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/artrybka/frame:latest
            ghcr.io/artrybka/frame:${{ steps.meta.outputs.version }}
            ghcr.io/artrybka/frame:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
