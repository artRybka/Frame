name: testflight

# Archives the iOS app and uploads it to TestFlight, no Mac needed.
# Needs an App Store Connect API key (Users and Access → Integrations →
# App Store Connect API, role Admin so Xcode can manage signing
# certificates) in three repository secrets:
#   ASC_KEY_ID     key ID
#   ASC_ISSUER_ID  issuer ID shown above the key list
#   ASC_KEY_P8     full contents of AuthKey_<id>.p8
# Without them the upload job is skipped.
#
# Version shown in TestFlight = the release version from ha-addon/config.yaml
# (bumped on every release), build number = UTC time. After Apple has
# processed the build, the `notes` job fills "What to Test" with that
# version's section of ha-addon/CHANGELOG.md (scripts/testflight-notes.py).

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::App Store Connect API key secrets are not set; skipping TestFlight upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Version and build number
        id: version
        # Build number from the UTC time, so every upload is higher than the last.
        run: |
          version="$(python3 ../scripts/testflight-notes.py version)"
          build="$(date -u +%y%m%d%H%M)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "::notice::TestFlight $version ($build)"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Archive
        # Unsigned: signing at archive time wants a development profile, which
        # needs a registered device. The export below signs for distribution
        # with an Apple-managed (cloud) certificate instead. Command-line
        # settings apply to every target, so the widget extension matches.
        run: >
          xcodebuild archive
          -project Frame.xcodeproj
          -scheme Frame
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/Frame.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          MARKETING_VERSION="${{ steps.version.outputs.version }}"
          CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"
      - name: Keep the entitlements for the export
        # The archive is unsigned, so it carries no entitlements, and the
        # export signs with what the archived app says it needs: an ad-hoc
        # signature with Frame.entitlements (push notifications) hands them
        # on. The extension first, then the app around it.
        run: |
          app="$RUNNER_TEMP/Frame.xcarchive/Products/Applications/Frame.app"
          for ext in "$app"/PlugIns/*.appex; do
            codesign --force --sign - --timestamp=none "$ext"
          done
          codesign --force --sign - --timestamp=none --entitlements Frame/Frame.entitlements "$app"
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q aps-environment
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>3MQRJF4A9D</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Frame.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"

  notes:
    # Separate Linux job: waiting for Apple's processing (usually 5–15 min)
    # should not hold a macOS runner.
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: What to Test from the CHANGELOG
        run: >
          python3 scripts/testflight-notes.py upload
          --bundle-id com.artrybka.frame
          --version "${{ needs.upload.outputs.version }}"
          --build "${{ needs.upload.outputs.build }}"
      - name: Remove the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
