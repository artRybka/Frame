configuration:
  device_host:
    name: Panel IP address
    description: IP address of the EM32DX (give it a fixed lease in your router).
  device_pin:
    name: Panel PIN
    description: MDC PIN shown on the panel while pairing with the Samsung E-Paper app.
  device_mac:
    name: Panel MAC address
    description: Needed for Wake-on-LAN.
  port:
    name: HTTP port
    description: Port the panel downloads content from.
  public_host:
    name: Public host
    description: Address the panel uses to reach Home Assistant; autodetected when empty.
  api_token:
    name: API token
    description: Bearer token required by the iOS app and tools.
  palette:
    name: Palette
    description: Built-in palette name or path to a palette JSON. A palette measured in the app (/data/palette.json) takes precedence.
  seed_library:
    name: Suggestions from museums
    description: On start, fetch public-domain works from museum collections for the Suggestions rotation when it runs low.
  anthropic_api_key:
    name: Anthropic API key
    description: Optional, for keywords and Polish texts from Claude. Usually entered in the app (Frame → gear → Konfiguracja), which wins over this one.
